# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Registered by the
# orchestrator; content authors produce the files and embed the include but do
# not edit this file.

- name: 00-build-and-test-loop
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The edit, mvn test, observe loop every example runs: a source change is
    compiled against JDK 25 and exercised by the JUnit 5 suite with Mockito and
    AssertJ, and a failing assertion sends you back to the source. A standalone
    module and the root aggregator run the identical loop.

- name: 01-forces-and-decisions
  section: "Ch. 1"
  title: Forces resolving to a named pattern
  caption: >-
    The arc the book trains for every pattern: recognize the forces, name a
    candidate pattern and a candidate non-pattern, choose the idiomatic Java
    expression, test the behavior, and know when not to use it.

- name: 02-pattern-vocabulary
  section: "Ch. 2"
  title: A pattern name as shared vocabulary
  caption: >-
    A pattern name sits between three readers, an engineer, a teammate, and an AI
    assistant, each one meant to read the same forces off the same word, not just
    the word itself.

- name: 03-open-closed-extension
  section: "Ch. 3"
  title: Open for extension, closed for modification
  caption: >-
    InvoiceCalculator depends on the InvoiceRule abstraction, never on a concrete
    rule, so a new rule arrives as a new type that implements the contract with
    no edit to the calculator or the rules that predate it.

- name: 04-dependency-inversion
  section: "Ch. 4"
  title: Inverting the dependency through an abstraction
  caption: >-
    A high-level policy depends on a role interface, not a concrete gateway, and
    the concrete gateways implement that same abstraction, so both sides meet at
    the interface instead of the policy reaching for a detail.

- name: 05-resource-lifecycle
  section: "Ch. 5"
  title: Guaranteed release on every path
  caption: >-
    A try-with-resources scope runs close() on both the normal exit and an
    exception unwinding the block, so a resource is released exactly once no
    matter how control leaves the scope.

- name: 06-encapsulation-boundary
  section: "Ch. 6"
  title: What a caller sees across the package boundary
  caption: >-
    A caller depends only on the public interface and a static factory; the
    concrete implementation and the representation behind it stay package-private,
    free to change without touching the caller.

- name: 07-test-anatomy
  section: "Ch. 7"
  title: The anatomy of one behavior test
  caption: >-
    One JUnit 5 test arranged with a mock, acting on the subject, and asserted two
    ways: AssertJ on the returned value and Mockito.verify on the interaction with
    a collaborator.

- name: 08-strategy-forces
  section: "Ch. 8"
  title: Strategy's forces
  caption: >-
    One caller, one contract, and a set of interchangeable algorithms behind it,
    each expressed a different idiomatic way, swapped without touching the
    caller.
