# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Registered by the
# orchestrator; content authors produce the files and embed the include but do
# not edit this file.

- name: 00-build-and-test-loop
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The edit, mvn test, observe loop every example runs: a source change is
    compiled against JDK 25 and exercised by the JUnit 5 suite with Mockito and
    AssertJ, and a failing assertion sends you back to the source. A standalone
    module and the root aggregator run the identical loop.

- name: 01-forces-and-decisions
  section: "Ch. 1"
  title: Forces resolving to a named pattern
  caption: >-
    The arc the book trains for every pattern: recognize the forces, name a
    candidate pattern and a candidate non-pattern, choose the idiomatic Java
    expression, test the behavior, and know when not to use it.

- name: 08-strategy-forces
  section: "Ch. 8"
  title: Strategy's forces
  caption: >-
    One caller, one contract, and a set of interchangeable algorithms behind it,
    each expressed a different idiomatic way, swapped without touching the
    caller.
