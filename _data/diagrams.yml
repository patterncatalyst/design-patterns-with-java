# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Registered by the
# orchestrator; content authors produce the files and embed the include but do
# not edit this file.

- name: 00-build-and-test-loop
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The edit, mvn test, observe loop every example runs: a source change is
    compiled against JDK 25 and exercised by the JUnit 5 suite with Mockito and
    AssertJ, and a failing assertion sends you back to the source. A standalone
    module and the root aggregator run the identical loop.

- name: 01-forces-and-decisions
  section: "Ch. 1"
  title: Forces resolving to a named pattern
  caption: >-
    The arc the book trains for every pattern: recognize the forces, name a
    candidate pattern and a candidate non-pattern, choose the idiomatic Java
    expression, test the behavior, and know when not to use it.

- name: 02-pattern-vocabulary
  section: "Ch. 2"
  title: A pattern name as shared vocabulary
  caption: >-
    A pattern name sits between three readers, an engineer, a teammate, and an AI
    assistant, each one meant to read the same forces off the same word, not just
    the word itself.

- name: 03-open-closed-extension
  section: "Ch. 3"
  title: Open for extension, closed for modification
  caption: >-
    InvoiceCalculator depends on the InvoiceRule abstraction, never on a concrete
    rule, so a new rule arrives as a new type that implements the contract with
    no edit to the calculator or the rules that predate it.

- name: 04-dependency-inversion
  section: "Ch. 4"
  title: Inverting the dependency through an abstraction
  caption: >-
    A high-level policy depends on a role interface, not a concrete gateway, and
    the concrete gateways implement that same abstraction, so both sides meet at
    the interface instead of the policy reaching for a detail.

- name: 05-resource-lifecycle
  section: "Ch. 5"
  title: Guaranteed release on every path
  caption: >-
    A try-with-resources scope runs close() on both the normal exit and an
    exception unwinding the block, so a resource is released exactly once no
    matter how control leaves the scope.

- name: 06-encapsulation-boundary
  section: "Ch. 6"
  title: What a caller sees across the package boundary
  caption: >-
    A caller depends only on the public interface and a static factory; the
    concrete implementation and the representation behind it stay package-private,
    free to change without touching the caller.

- name: 07-test-anatomy
  section: "Ch. 7"
  title: The anatomy of one behavior test
  caption: >-
    One JUnit 5 test arranged with a mock, acting on the subject, and asserted two
    ways: AssertJ on the returned value and Mockito.verify on the interaction with
    a collaborator.

- name: 08-strategy-forces
  section: "Ch. 8"
  title: Strategy's forces
  caption: >-
    One caller, one contract, and a set of interchangeable algorithms behind it,
    each expressed a different idiomatic way, swapped without touching the
    caller.

- name: 09-template-method-skeleton
  section: "Ch. 9"
  title: A fixed skeleton with pluggable steps
  caption: >-
    The order-processing pipeline's fixed, final sequence runs an invariant check
    and three varying steps in order; a channel supplies those steps by overriding
    an abstract class or by handing the pipeline three lambdas.

- name: 10-shipment-state-transitions
  section: "Ch. 10"
  title: A shipment's legal states and transitions
  caption: >-
    The legal shipment states and the transitions between them, with the
    stochastic outlet the probabilistic machine draws from while a shipment is in
    transit.

- name: 11-command-undo-and-queue
  section: "Ch. 11"
  title: A request captured as a command
  caption: >-
    A request becomes a command that flows through a queue and an undo-redo history
    into the warehouse ledger, so it can be ordered, replayed, and reversed rather
    than run and forgotten.

- name: 12-factory-family-selection
  section: "Ch. 12"
  title: One factory call, a consistent family
  caption: >-
    A regional factory resolves one toolkit from a region value, and the chosen
    toolkit's whole family of label formatter, rate table, and customs form reaches
    the client together, from a single factory call.

- name: 13-builder-and-prototype
  section: "Ch. 13"
  title: Assemble then validate; copy an exemplar
  caption: >-
    A builder accumulates required and optional fields and validates every
    invariant once at build time; a prototype clones a configured exemplar into an
    independent copy rather than rebuilding it.

- name: 14-singleton-vs-injected-collaborator
  section: "Ch. 14"
  title: Hidden global versus injected collaborator
  caption: >-
    A global singleton's callers reach one shared instance with no parameter
    announcing it; the injected alternative routes the same capability through a
    constructor a composition root controls, which is what makes it testable.

- name: 15-adapter-facade-bridge-forces
  section: "Ch. 15"
  title: Adapt, simplify, or split an abstraction
  caption: >-
    Adapter wraps a foreign type to the interface the app expects, Facade presents
    one small surface over a subsystem, and Bridge lets an abstraction and its
    implementation vary without a class for every combination.

- name: 16-decorator-proxy
  section: "Ch. 16"
  title: Wrapping to add behavior or control access
  caption: >-
    A decorator stack adds behavior layer by layer behind the same interface, while
    a proxy stands in front of the real subject through that same interface to
    control access, caching, or lazy creation.

- name: 17-composite-flyweight-tree-and-pool
  section: "Ch. 17"
  title: A uniform tree and a shared pool
  caption: >-
    Composite lets a leaf and a tree answer the same interface so a caller treats
    them alike; Flyweight interns one shared instance of immutable intrinsic state
    that many objects point at instead of each holding a copy.

- name: 18-observer-mediator
  section: "Ch. 18"
  title: Fan-out to listeners; route through a hub
  caption: >-
    An Observer subject fans a change out to independent listeners that it never
    names, next to a Mediator hub that routes between collaborators so they never
    call each other directly.

- name: 19-chain-iterator
  section: "Ch. 19"
  title: Pass along handlers; traverse without exposing structure
  caption: >-
    A request passes down a chain of handlers until one takes it and the rest never
    run, while an iterator walks an aggregate's elements in order without the caller
    knowing how they are stored.

- name: 20-visitor-switch-operations
  section: "Ch. 20"
  title: Operations as switches over a fixed set
  caption: >-
    A fixed set of node kinds on one side, several independent operations on the
    other, each operation its own exhaustive pattern-matching switch with no accept
    method anywhere on the node types.

- name: 21-records-sealed-switches
  section: "Ch. 21"
  title: Records and sealed types, operations as switches
  caption: >-
    A sealed set of record variants on one side and several external operations on
    the other, each an exhaustive pattern-matching switch the compiler checks, with
    no accept method anywhere on the record types.

- name: 22-functional-java-pipeline
  section: "Ch. 22"
  title: Patterns as everyday functional Java
  caption: >-
    A shipment moves through enum-carried behavior, a functional Strategy or
    Command, a stream pipeline, and an Optional return, each stage an idiomatic
    Java 25 construct that is also a classic pattern in disguise.

- name: 23-idiom-retirement-map
  section: "Ch. 23"
  title: Which Java 25 feature retires which idiom
  caption: >-
    Each classic idiom this book built by hand, paired with the Java 25 feature
    that gets the identical guarantee from the compiler or the runtime instead: the
    enum for the singleton, the record for the value class, sealed plus switch for
    the visitor, Optional for the null check.

- name: 24-mount-unmount-carriers
  section: "Ch. 24"
  title: Virtual threads mount and unmount on carriers
  caption: >-
    Many virtual threads mount and unmount on a small pool of carrier threads while
    they block on I/O, so thousands of blocking carrier calls run concurrently
    without thousands of platform threads.

- name: 25-bounded-resource-pool
  section: "Ch. 25"
  title: A bounded resource pool
  caption: >-
    A bounded connection pool hands out leases up to its capacity and blocks further
    callers until one is returned, with a timeout path for a caller that waits too
    long.

- name: 26-shortcut-dispatch
  section: "Ch. 26"
  title: A key resolves to a short handler
  caption: >-
    A closed enum key and an open string key each resolve through a small dispatch
    table to a short handler, and an unmatched open key still has a defined fallback
    route.

- name: 27-anti-patterns
  section: "Ch. 27"
  title: An over-patterned design collapses
  caption: >-
    A design stacked with a singleton registry, a one-implementation interface, a
    factory of factories, and a god object collapses to the simpler service that
    does the same job and passes the same tests.

- name: 28-quarkus-cdi-composition-root
  section: "Ch. 28"
  title: The CDI container as composition root
  caption: >-
    The Quarkus Arc container wires the beans, and each CDI mechanism answers a
    pattern the book built by hand: @ConfigMapping for Strategy selection, @Produces
    for Factory, @ApplicationScoped plus constructor injection for Singleton and DI,
    an @AroundInvoke interceptor for Decorator and Proxy, and a CDI event with
    @Observes for Observer.

- name: 29-seams-and-substitution
  section: "Ch. 29"
  title: Seams make a dependency substitutable
  caption: >-
    The same inherited dependencies made substitutable: an object seam injects a
    Clock, an extract-interface seam puts a CarrierGateway behind an interface a test
    can replace, and subclass-and-override opens a seam where there is no constructor
    to change.

- name: 30-dependency-breaking
  section: "Ch. 30"
  title: Breaking a hard-wired dependency
  caption: >-
    A class that constructs and calls a concrete collaborator directly, with no seam,
    becomes testable once Extract Interface and Parameterize Constructor let either
    the real gateway or a test double sit behind the interface.

- name: 31-characterization-as-a-safety-net
  section: "Ch. 31"
  title: Characterization tests as a safety net
  caption: >-
    A characterization suite pins the legacy calculator's current behavior, so a
    Fowler-style refactor to a cleaner calculator is verified safe when every pinned
    case stays green.

- name: 32-strangler-fee-router
  section: "Ch. 32"
  title: A strangler router over old and new
  caption: >-
    A router behind a stable interface consults a migration registry and sends each
    shipment to the legacy or the modern calculator, so the new implementation grows
    while the old still serves un-migrated traffic.
