<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="170" width="840" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="190" font-size="12" font-weight="700" fill="#888">three readers of one name</text>
<rect x="340" y="30" width="200" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="440.0" y="65.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Strategy</text>
<text x="440.0" y="82.5" font-size="11.5" fill="#555555" text-anchor="middle">forces: a rate that varies,</text>
<text x="440.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">selected per carrier, by team</text>
<rect x="50" y="220" width="220" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="160.0" y="260.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Engineer</text>
<text x="160.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">writes &quot;this needs to be</text>
<text x="160.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">a Strategy&quot; in the review</text>
<rect x="330" y="220" width="220" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="440.0" y="260.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Teammate</text>
<text x="440.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">reviews the diff against</text>
<text x="440.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">the same forces</text>
<rect x="610" y="220" width="220" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="260.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AI assistant</text>
<text x="720.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">receives the forces as</text>
<text x="720.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">the prompt&#x27;s intent</text>
<path d="M400,120 L160,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="260.0" y="166.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">the forces</text>
<text x="260.0" y="166.0" font-size="11" fill="#555" text-anchor="middle">the forces</text>
<path d="M440,120 L440,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="450.0" y="166.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">not just the word</text>
<text x="450.0" y="166.0" font-size="11" fill="#555" text-anchor="middle">not just the word</text>
<path d="M480,120 L720,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="620.0" y="166.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">the forces</text>
<text x="620.0" y="166.0" font-size="11" fill="#b8650a" text-anchor="middle">the forces</text>
<text x="440" y="15" font-size="11" fill="#888" text-anchor="middle" font-weight="700">Naming the pattern: one word, three readers</text>
<text x="440" y="425" font-size="11" fill="#888" text-anchor="middle">A vague name breaks the compression for all three readers at once.</text>
</svg>