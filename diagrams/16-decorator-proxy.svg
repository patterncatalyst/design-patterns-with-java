<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="30" width="410" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#888">Decorator: a stack of layers</text>
<rect x="470" y="30" width="410" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="482" y="50" font-size="12" font-weight="700" fill="#888">Proxy: one stand-in</text>
<rect x="60" y="65" width="330" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="225.0" y="88.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Checkout</text>
<text x="225.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">holds a RateQuoter</text>
<rect x="60" y="140" width="330" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="225.0" y="165.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SurchargeRateQuoter</text>
<text x="225.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">+ insurance markup</text>
<rect x="60" y="220" width="330" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="225.0" y="245.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CachingRateQuoter</text>
<text x="225.0" y="262.5" font-size="11.5" fill="#555555" text-anchor="middle">memoizes by Shipment</text>
<rect x="60" y="300" width="330" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="225.0" y="325.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LoggingRateQuoter</text>
<text x="225.0" y="342.5" font-size="11.5" fill="#555555" text-anchor="middle">appends to call log</text>
<rect x="60" y="390" width="330" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="225.0" y="418.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LiveCarrierGateway (core)</text>
<text x="225.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">real tariff lookup</text>
<rect x="510" y="65" width="330" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="675.0" y="88.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Warehouse scanner</text>
<text x="675.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">holds a RateQuoter</text>
<rect x="510" y="150" width="330" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="675.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateQuoterAccessControl</text>
<text x="675.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">java.lang.reflect.Proxy + InvocationHandler</text>
<rect x="510" y="390" width="330" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="675.0" y="418.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LiveCarrierGateway (real subject)</text>
<text x="675.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">built lazily, same type</text>
<path d="M225,115 L225,140" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M225,195 L225,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="231.0" y="201.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">wraps</text>
