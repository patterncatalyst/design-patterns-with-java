<text x="231.0" y="281.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">wraps</text>
<text x="231.0" y="281.5" font-size="11" fill="#555" text-anchor="middle">wraps</text>
<path d="M225,355 L225,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="231.0" y="366.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">wraps</text>
<text x="231.0" y="366.5" font-size="11" fill="#555" text-anchor="middle">wraps</text>
<path d="M675,115 L675,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M675,220 L675,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="681.0" y="299.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">forwards (or denies)</text>
<text x="681.0" y="299.0" font-size="11" fill="#555" text-anchor="middle">forwards (or denies)</text>
<text x="450" y="20" font-size="14" fill="#888" text-anchor="middle" font-weight="700">Same RateQuoter interface, two different reasons to wrap it</text>
<text x="225" y="480" font-size="11.5" fill="#888" text-anchor="middle">Each layer adds one responsibility; stacking order changes what each layer sees.</text>
<text x="675" y="480" font-size="11.5" fill="#888" text-anchor="middle">Caller cannot tell proxy from real subject; only access or timing changes.</text>
</svg>