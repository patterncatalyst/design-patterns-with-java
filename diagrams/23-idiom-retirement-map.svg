<rect x="30" y="70" width="350" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205.0" y="99.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Double-checked locking</text>
<text x="205.0" y="116.0" font-size="11.5" fill="#555555" text-anchor="middle">with a volatile field, three facts to get right at once</text>
<rect x="560" y="70" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="99.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Enum singleton /</text>
<text x="735.0" y="116.0" font-size="11.5" fill="#555555" text-anchor="middle">initialization-on-demand holder</text>
<rect x="30" y="152" width="350" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205.0" y="181.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Hand-written value class</text>
<text x="205.0" y="198.0" font-size="11.5" fill="#555555" text-anchor="middle">getters, equals, hashCode, toString, defensive copies</text>
<rect x="560" y="152" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="181.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Record</text>
<text x="735.0" y="198.0" font-size="11.5" fill="#555555" text-anchor="middle">compiler-generated, immutable by construction</text>
