<text x="205.0" y="263.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Double-dispatch Visitor /</text>
<text x="205.0" y="280.0" font-size="11.5" fill="#555555" text-anchor="middle">instanceof-cast chain</text>
<rect x="560" y="234" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="263.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Sealed interface +</text>
<text x="735.0" y="280.0" font-size="11.5" fill="#555555" text-anchor="middle">exhaustive pattern-matching switch</text>
<rect x="30" y="316" width="350" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205.0" y="345.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Null Object /</text>
<text x="205.0" y="362.0" font-size="11.5" fill="#555555" text-anchor="middle">scattered null check</text>
<rect x="560" y="316" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="345.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Optional</text>
<text x="735.0" y="362.0" font-size="11.5" fill="#555555" text-anchor="middle">absence as a type, not a convention</text>
<rect x="30" y="398" width="350" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205.0" y="427.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">try / finally</text>
<text x="205.0" y="444.0" font-size="11.5" fill="#555555" text-anchor="middle">cleanup written by hand, easy to get wrong under an exception</text>
<rect x="560" y="398" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="427.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">try-with-resources</text>
<text x="735.0" y="444.0" font-size="11.5" fill="#555555" text-anchor="middle">AutoCloseable cleanup the compiler guarantees</text>
<rect x="30" y="480" width="350" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205.0" y="509.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fall-through switch statement</text>
<text x="205.0" y="526.0" font-size="11.5" fill="#555555" text-anchor="middle">missing break is a silent bug</text>
<rect x="560" y="480" width="350" height="62" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="509.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">switch expression</text>
<text x="735.0" y="526.0" font-size="11.5" fill="#555555" text-anchor="middle">every arm yields a value, no fallthrough</text>
