<text x="450" y="30" font-size="18" fill="#888" text-anchor="middle" font-weight="700">Visitor as operations over a fixed, sealed hierarchy</text>
<text x="450" y="418" font-size="11" fill="#888" text-anchor="middle">Each operation owns its own exhaustive switch; one dispatch point is shown for clarity.</text>
<text x="450" y="438" font-size="11" fill="#888" text-anchor="middle">A fifth ManifestEntry kind fails every switch at compile time until each one adds a case.</text>
