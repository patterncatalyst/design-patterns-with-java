<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="310" y="115" width="240" height="210" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="322" y="135" font-size="12" font-weight="700" fill="#888">requests: BlockingQueue&lt;Runnable&gt;</text>
<rect x="40" y="60" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="85.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller A</text>
<text x="125.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestA)</text>
<rect x="40" y="145" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller B</text>
<text x="125.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestB)</text>
<rect x="40" y="230" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="255.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller C</text>
<text x="125.0" y="272.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestC)</text>
<rect x="340" y="150" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="430.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request A (queued)</text>
<rect x="340" y="205" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="430.0" y="230.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request B (queued)</text>
<rect x="340" y="260" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="430.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request C (queued)</text>
<rect x="650" y="60" width="240" height="140" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="770.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">label-print-worker</text>
<text x="770.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">one dedicated thread, drains FIFO</text>
<rect x="310" y="350" width="580" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="375.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Compare: ledger.print(request) blocks the caller</text>
<text x="600.0" y="392.5" font-size="11.5" fill="#555555" text-anchor="middle">until the job finishes; nothing here decouples the two</text>
<path d="M210,112 L310,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="272.0" y="125.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enqueue</text>
<text x="272.0" y="125.0" font-size="11" fill="#555" text-anchor="middle">enqueue</text>
<path d="M210,172 L310,225" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,257 L310,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M550,170 L650,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="592.0" y="162.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">dequeue, FIFO</text>
<text x="592.0" y="162.0" font-size="11" fill="#555" text-anchor="middle">dequeue, FIFO</text>
<path d="M650,88 L210,88" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="430.0" y="80.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">future.complete(): later, on this thread</text>
<text x="430.0" y="80.0" font-size="11" fill="#b8650a" text-anchor="middle">future.complete(): later, on this thread</text>
<text x="465" y="25" font-size="13" fill="#888" text-anchor="middle" font-weight="700">Active Object: the call returns before the work runs</text>
<text x="465" y="440" font-size="11" fill="#64748b" text-anchor="middle">Every caller&#x27;s CompletableFuture resolves off the caller&#x27;s own thread: the one guarantee a direct call cannot make.</text>
</svg>