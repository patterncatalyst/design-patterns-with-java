<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="280" y="50" width="240" height="280" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="292" y="70" font-size="12" font-weight="700" fill="#888">requests: BlockingQueue&lt;Runnable&gt;</text>
<rect x="40" y="70" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="95.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller A</text>
<text x="125.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestA)</text>
<rect x="40" y="150" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller B</text>
<text x="125.0" y="192.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestB)</text>
<rect x="40" y="230" width="170" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="255.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caller C</text>
<text x="125.0" y="272.5" font-size="11.5" fill="#555555" text-anchor="middle">submitPrint(requestC)</text>
<rect x="310" y="100" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="400.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request A (queued)</text>
<rect x="310" y="150" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="400.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request B (queued)</text>
<rect x="310" y="200" width="180" height="40" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="400.0" y="225.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">request C (queued)</text>
<rect x="600" y="160" width="240" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">label-print-worker</text>
<text x="720.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">one dedicated thread, drains FIFO</text>
<rect x="280" y="350" width="560" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="375.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Compare: ledger.print(request) blocks the caller</text>
<text x="560.0" y="392.5" font-size="11.5" fill="#555555" text-anchor="middle">until the job finishes — nothing here decouples the two</text>
<path d="M210,97 L280,120" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="251.0" y="102.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enqueue</text>
<text x="251.0" y="102.5" font-size="11" fill="#555" text-anchor="middle">enqueue</text>
<path d="M210,177 L280,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,257 L280,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,195 L600,195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="566.0" y="189.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">dequeue, FIFO</text>
<text x="566.0" y="189.0" font-size="11" fill="#555" text-anchor="middle">dequeue, FIFO</text>
<path d="M600,175 L210,97" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="411.0" y="130.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">future.complete() — later, on this thread</text>
<text x="411.0" y="130.0" font-size="11" fill="#b8650a" text-anchor="middle">future.complete() — later, on this thread</text>
<text x="450" y="25" font-size="13" fill="#888" text-anchor="middle" font-weight="700">Active Object: the call returns before the work runs</text>
<text x="450" y="425" font-size="11" fill="#64748b" text-anchor="middle">Every caller&#x27;s CompletableFuture resolves off the caller&#x27;s own thread — the one guarantee a direct call cannot make.</text>
</svg>